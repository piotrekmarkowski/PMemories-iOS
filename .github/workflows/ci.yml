name: iOS CI

# Etap 1 (13.09.2026): sama Continuous Integration — build na symulatorze,
# bez podpisywania. Złapałoby np. zapomniany `xcodegen generate` po nowym
# pliku .swift (gotcha, który w tym projekcie powtarzał się kilka razy).
#
# Etap 2 (14.09.2026): dodane prawdziwe testy jednostkowe (`PMemoriesAppTests`,
# Swift Testing, czyste funkcje bez SwiftData: `TravelAchievementsCalculator`,
# `Season`, `SolarTime`). Testy są "hosted" (uruchamiają się wewnątrz procesu
# appki, standardowy wymóg `@testable import` dla appki, nie biblioteki) —
# potrzebują realnie uruchomionego symulatora, nie tylko builda. Nazwa
# konkretnego urządzenia symulatora na runnerze GitHuba jest niepewna z
# wyprzedzeniem (zmienia się z obrazem), więc krok niżej wybiera automatycznie
# PIERWSZY dostępny symulator iPhone zamiast zgadywać na sztywno nazwę.
#
# Etap 3 (14.09.2026): powiadomienia na Telegram (bot "PMemories CI",
# osobny od bota tradingowego PMQuant — świadomie, żeby alerty appki nie
# mieszały się z sygnałami tradingowymi w tym samym czacie) — token/chat ID
# w sekretach repo (`TELEGRAM_BOT_TOKEN`/`TELEGRAM_CHAT_ID`), nigdy w kodzie.
# Świadomie BEZ auto-fixa i BEZ auto-deploya — user: "chcę mieć nad tym
# kontrolę, chcę żeby mi wykrywał błędy... a naprawę zlecasz mi ręcznie".
# CI tylko wykrywa i informuje (co się zepsuło + link do logu, a przy
# kolejnym zielonym pushu — potwierdzenie że naprawione), nic nie robi
# samo z appką/repo poza tym.
#
# Świadomie NIE robi (jeszcze): archiwizacji/uploadu na TestFlight — wymaga
# sekretów podpisywania (klucz API App Store Connect), osobny, późniejszy
# etap. Rozwój etapami, nie wszystko naraz — ten sam duch co reszta projektu.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 14.09.2026, user: "czy mogę mieć robiony test bugów i błędów codziennie
  # o 12 PM" — codzienne sprawdzenie `main`, niezależnie od tego czy ktoś
  # coś pushnął. Zaplanowane triggery (`schedule`) ZAWSZE odpalają się na
  # gałęzi domyślnej (main), niezależnie gdzie leży ten plik. Cron GitHuba
  # liczy czas w UTC, nie zna stref czasowych/czasu letniego — 11:00 UTC =
  # 12:00 w UK w czasie letnim (BST, aktualnie), ale 11:00 w czasie zimowym
  # (GMT) po przejściu na czas zimowy pod koniec października. Do
  # poprawienia ręcznie na `0 12 * * *`, jeśli user zauważy że po zmianie
  # czasu powiadomienie przychodzi o 13:00 zamiast 12:00.
  schedule:
    - cron: '0 11 * * *'
  # 15.09.2026 — user: "chcę mieć menu w moim CI bocie... czy mogę włączyć
  # skan żeby mi przejrzał wszystkie błędy na zawołanie". `workflow_dispatch`
  # pozwala odpalić TEN SAM build+testy ręcznie z zewnątrz (przycisk/komenda
  # `/scan` w bocie Telegram, patrz `telegram-bot/listener.py`) — nie tylko
  # automatycznie przy pushu/PR/harmonogramie.
  workflow_dispatch:

jobs:
  build:
    name: Build (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Diagnostyczne — jeśli build kiedyś padnie na brakującym SDK, ten
      # log od razu pokaże co runner GitHuba faktycznie ma zainstalowane,
      # zamiast zgadywać.
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      # 14.09.2026: domyślny Xcode na tym obrazie runnera to 16.4 (dużo
      # starszy niż lokalny 26.6) — z nim `build-for-testing` padał na
      # fałszywym "type 'TravelAchievementsCalculator' has no member
      # 'countryGroupingCode'" (symbol REALNIE istnieje, kompiluje się
      # lokalnie bez problemu) — wygląda na quirk starszego Swift
      # compilera przy `@testable import` + explicit module builds.
      # Runner ma też zainstalowane 26.3 — jawny wybór zamiast polegania
      # na domyślnym `xcode-select`.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available iOS -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Picked simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Rozbite na dwa kroki (nie jedno `xcodebuild test`) — standardowy,
      # bardziej niezawodny wzorzec CI (przydatny też np. do współdzielenia
      # jednego builda między kilkoma równoległymi runami testów). Pierwotnie
      # podejrzewany jako fix na wyścig w harmonogramowaniu, ale prawdziwą
      # przyczyną błędu "has no member" okazał się Xcode 16.4 (patrz krok
      # "Select Xcode 26.3" wyżej) — zostaje mimo to, bo to i tak lepszy
      # wzorzec niż jedno połączone `xcodebuild test`.
      # `set -o pipefail` KRYTYCZNE — bez tego `| tee` maskuje kod wyjścia
      # xcodebuild (pipe bez pipefail zwraca kod OSTATNIEGO polecenia, czyli
      # zawsze-udanego `tee`), więc krok "udawałby" sukces nawet gdy build
      # faktycznie padł, i powiadomienie Telegram niżej nigdy by się nie
      # odpaliło.
      - name: Build for Testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PMemoriesApp.xcodeproj \
            -scheme PMemoriesApp \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            2>&1 | tee build.log

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PMemoriesApp.xcodeproj \
            -scheme PMemoriesApp \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            2>&1 | tee test.log

      # 14.09.2026 — user: "chcę dostawać info na Telegram co było błędem i
      # czy naprawione", ŚWIADOMIE bez auto-fixa/auto-deploya (chce
      # zachować kontrolę nad tym co się realnie zmienia w appce) — samo
      # wykrywanie + powiadamianie, naprawę zleca ręcznie. `if: failure()`/
      # `if: success()` odpalają się WYŁĄCZNIE gdy poprzednie kroki JOBA
      # faktycznie failed/passed (standardowa semantyka GitHub Actions),
      # więc drugi krok nigdy nie wyśle "naprawione" po failu.
      # `printf` zamiast wieloliniowego `"..."` — string bash rozciągnięty na
      # kilka linii zaczynających się od kolumny 0 łamie wcięcia bloku YAML
      # (`run: |` wymaga, żeby KAŻDA linia treści była wcięta co najmniej
      # tak samo jak pierwsza — inaczej YAML uznaje blok za zakończony i
      # próbuje sparsować dalszy tekst jako nowe klucze, co dawało błąd
      # składni całego workflow, złapane na pierwszym realnym pushu).
      # `printf` z `%s` trzyma wszystko w jednej, poprawnie wciętej linii i
      # bezpiecznie wstawia treść commita (może zawierać cudzysłowy/znaki
      # specjalne) bez ryzyka złamania cudzysłowów.
      #
      # `github.head_ref || github.ref_name` — dla eventów `pull_request`
      # `ref_name` to wewnętrzna referencja scalania GitHuba ("2/merge"), nie
      # prawdziwa nazwa gałęzi — złapane na żywo (user dostał "Gałąź:
      # 2/merge" na Telegramie). `head_ref` istnieje tylko dla PR-ów i
      # zawiera prawdziwą nazwę gałęzi źródłowej; dla push/schedule jest
      # puste, więc `|| ref_name` wtedy poprawnie wraca do zwykłej gałęzi.
      # 15.09.2026 — realny bug znaleziony na PIERWSZYM pushu bezpośrednio na
      # `main` (squash-merge z PR-a): `github.event.head_commit.message` dla
      # squasha niesie CAŁY, wieloliniowy opis PR-a (nie samą jedną linię
      # jak zwykły commit) — wklejony wprost w `${{ }}` string bash
      # ("COMMIT_MSG=\"...\"") łamał składnię skryptu (dosłowne nowe linie,
      # cudzysłowy w treści commita). `env:` (nie interpolacja w `run:`)
      # jest bezpieczne dla dowolnej wieloliniowej/dziwnej treści — GitHub
      # Actions zapisuje zmienne środowiskowe przez plik, nie przez
      # podstawianie tekstu w skrypt shella. Dodatkowo i tak ucinamy do
      # PIERWSZEJ LINII (`head -1`) — cały wieloakapitowy opis commita byłby
      # nieczytelny w powiadomieniu na telefonie.
      # 15.09.2026 — user: "jak mi pokaże błędy żeby były zrozumiałe dla
      # mnie" — surowe linijki kompilatora Swift ("has no member", "cannot
      # find type in scope") są nieczytelne bez znajomości Swifta. Ten krok
      # woła Claude Code w trybie bezobsługowym (`claude -p`, ten sam
      # `CLAUDE_CODE_OAUTH_TOKEN` co `auto-fix.yml`, ale TYLKO odczyt —
      # bez `--allowedTools` z Edit/Write/Bash, więc fizycznie nic nie może
      # zmienić) i prosi o krótkie, polskie wyjaśnienie PRZYCZYNY po ludzku,
      # nie o poprawkę (to wciąż robi dopiero `auto-fix.yml` po kliknięciu
      # "🔧 Napraw"). Zapisane do pliku (nie `$GITHUB_OUTPUT`) — ten sam
      # powód co przy `RAW_COMMIT_MSG` niżej: wynik może zawierać nowe
      # linie/cudzysłowy, plik + `printf %s` jest na to odporne.
      # 15.09.2026 — user: "język polski i angielski żeby był do wyboru" —
      # `vars.CI_LANG` to zmienna repo (GitHub Actions "Variables", NIE
      # "Secrets" — jawny, nietajny wybór), ustawiana zdalnie komendą
      # `/lang` w bocie Telegram (patrz `telegram-bot/listener.py`, które
      # woła GitHub API żeby ją zmienić). Domyślnie `pl` gdy jeszcze nikt
      # jej nie ustawił.
      - name: Explain errors in plain language
        if: failure()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CI_LANG: ${{ vars.CI_LANG || 'pl' }}
        run: |
          ERRORS=$(grep -h "error:" build.log test.log 2>/dev/null | head -20)
          if [ -z "$ERRORS" ]; then
            if [ "$CI_LANG" = "en" ]; then
              echo "(no clear compiler errors in the log — see the full log via the link below)" > explanation.txt
            else
              echo "(brak jasnych błędów kompilatora w logu — zobacz pełny log pod linkiem)" > explanation.txt
            fi
          else
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
            # UWAGA: `PROMPT="...tekst na kilku liniach..."` (dosłowne nowe
            # linie w środku przypisania) łamie wcięcie bloku YAML `run: |`
            # dokładnie tak samo jak przy `COMMIT_MSG` wyżej w tym pliku —
            # `printf %s\n%s` na JEDNEJ linii omija to całkowicie.
            if [ "$CI_LANG" = "en" ]; then
              PROMPT=$(printf 'Explain IN ENGLISH, in plain language, with no programming jargon, what went wrong in this iOS app (Swift/SwiftUI) based on the compiler errors below. Max 3-4 sentences. Explain the CAUSE, do not propose a fix (that is a separate step). Errors:\n\n%s' "$ERRORS")
            else
              PROMPT=$(printf 'Wytłumacz PO POLSKU, prostym językiem, bez żargonu programistycznego, co poszło nie tak w tej aplikacji iOS (Swift/SwiftUI) na podstawie poniższych błędów kompilatora. Maksymalnie 3-4 zdania. Wytłumacz PRZYCZYNĘ, nie proponuj poprawki (to osobny krok). Błędy:\n\n%s' "$ERRORS")
            fi
            claude -p "$PROMPT" --max-turns 1 > explanation.txt 2>/dev/null
            if [ ! -s explanation.txt ]; then
              if [ "$CI_LANG" = "en" ]; then
                echo "(couldn't generate an explanation — see the raw errors via the link below)" > explanation.txt
              else
                echo "(nie udało się wygenerować wyjaśnienia — zobacz surowe błędy pod linkiem)" > explanation.txt
              fi
            fi
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Codzienne sprawdzenie (harmonogram)' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_LANG: ${{ vars.CI_LANG || 'pl' }}
        run: |
          EXPLANATION=$(cat explanation.txt 2>/dev/null || echo "(zobacz pełny log pod linkiem niżej)")
          COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | head -1)
          if [ "$CI_LANG" = "en" ]; then
            MESSAGE=$(printf '❌ PMemories iOS CI FAILED\nBranch: %s\nCommit: %s\n\n%s\n\n%s' "$BRANCH" "$COMMIT_MSG" "$EXPLANATION" "$RUN_URL")
            BUTTON_TEXT="🔧 Fix"
          else
            MESSAGE=$(printf '❌ PMemories iOS CI FAILED\nGałąź: %s\nCommit: %s\n\n%s\n\n%s' "$BRANCH" "$COMMIT_MSG" "$EXPLANATION" "$RUN_URL")
            BUTTON_TEXT="🔧 Napraw"
          fi
          # Przycisk "🔧 Napraw" — callback_data niesie "fix:ios:<run_id>",
          # żeby listener na VPS (`telegram-bot/`, TERAZ wspólny dla
          # PMemories-iOS i PMemories-Android, 15.09.2026) wiedział KTÓRY
          # run w KTÓRYM repo przekazać dalej do `auto-fix.yml`
          # (workflow_dispatch). Sam button NIE naprawia nic sam z siebie —
          # dopiero jego kliknięcie odpala osobny workflow, patrz komentarz
          # w `auto-fix.yml`.
          KEYBOARD="{\"inline_keyboard\":[[{\"text\":\"${BUTTON_TEXT}\",\"callback_data\":\"fix:ios:${{ github.run_id }}\"}]]}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "reply_markup=${KEYBOARD}" > /dev/null

      - name: Notify Telegram on success
        if: success()
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Codzienne sprawdzenie (harmonogram)' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_LANG: ${{ vars.CI_LANG || 'pl' }}
        run: |
          COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | head -1)
          if [ "$CI_LANG" = "en" ]; then
            MESSAGE=$(printf '✅ PMemories iOS CI passed\nBranch: %s\nCommit: %s' "$BRANCH" "$COMMIT_MSG")
          else
            MESSAGE=$(printf '✅ PMemories iOS CI passed\nGałąź: %s\nCommit: %s' "$BRANCH" "$COMMIT_MSG")
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
