name: iOS CI

# Etap 1 (13.09.2026): sama Continuous Integration — build na symulatorze,
# bez podpisywania. Złapałoby np. zapomniany `xcodegen generate` po nowym
# pliku .swift (gotcha, który w tym projekcie powtarzał się kilka razy).
#
# Etap 2 (14.09.2026): dodane prawdziwe testy jednostkowe (`PMemoriesAppTests`,
# Swift Testing, czyste funkcje bez SwiftData: `TravelAchievementsCalculator`,
# `Season`, `SolarTime`). Testy są "hosted" (uruchamiają się wewnątrz procesu
# appki, standardowy wymóg `@testable import` dla appki, nie biblioteki) —
# potrzebują realnie uruchomionego symulatora, nie tylko builda. Nazwa
# konkretnego urządzenia symulatora na runnerze GitHuba jest niepewna z
# wyprzedzeniem (zmienia się z obrazem), więc krok niżej wybiera automatycznie
# PIERWSZY dostępny symulator iPhone zamiast zgadywać na sztywno nazwę.
#
# Etap 3 (14.09.2026): powiadomienia na Telegram (bot "PMemories CI",
# osobny od bota tradingowego PMQuant — świadomie, żeby alerty appki nie
# mieszały się z sygnałami tradingowymi w tym samym czacie) — token/chat ID
# w sekretach repo (`TELEGRAM_BOT_TOKEN`/`TELEGRAM_CHAT_ID`), nigdy w kodzie.
# Świadomie BEZ auto-fixa i BEZ auto-deploya — user: "chcę mieć nad tym
# kontrolę, chcę żeby mi wykrywał błędy... a naprawę zlecasz mi ręcznie".
# CI tylko wykrywa i informuje (co się zepsuło + link do logu, a przy
# kolejnym zielonym pushu — potwierdzenie że naprawione), nic nie robi
# samo z appką/repo poza tym.
#
# Świadomie NIE robi (jeszcze): archiwizacji/uploadu na TestFlight — wymaga
# sekretów podpisywania (klucz API App Store Connect), osobny, późniejszy
# etap. Rozwój etapami, nie wszystko naraz — ten sam duch co reszta projektu.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 14.09.2026, user: "czy mogę mieć robiony test bugów i błędów codziennie
  # o 12 PM" — codzienne sprawdzenie `main`, niezależnie od tego czy ktoś
  # coś pushnął. Zaplanowane triggery (`schedule`) ZAWSZE odpalają się na
  # gałęzi domyślnej (main), niezależnie gdzie leży ten plik. Cron GitHuba
  # liczy czas w UTC, nie zna stref czasowych/czasu letniego — 11:00 UTC =
  # 12:00 w UK w czasie letnim (BST, aktualnie), ale 11:00 w czasie zimowym
  # (GMT) po przejściu na czas zimowy pod koniec października. Do
  # poprawienia ręcznie na `0 12 * * *`, jeśli user zauważy że po zmianie
  # czasu powiadomienie przychodzi o 13:00 zamiast 12:00.
  schedule:
    - cron: '0 11 * * *'

jobs:
  build:
    name: Build (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Diagnostyczne — jeśli build kiedyś padnie na brakującym SDK, ten
      # log od razu pokaże co runner GitHuba faktycznie ma zainstalowane,
      # zamiast zgadywać.
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      # 14.09.2026: domyślny Xcode na tym obrazie runnera to 16.4 (dużo
      # starszy niż lokalny 26.6) — z nim `build-for-testing` padał na
      # fałszywym "type 'TravelAchievementsCalculator' has no member
      # 'countryGroupingCode'" (symbol REALNIE istnieje, kompiluje się
      # lokalnie bez problemu) — wygląda na quirk starszego Swift
      # compilera przy `@testable import` + explicit module builds.
      # Runner ma też zainstalowane 26.3 — jawny wybór zamiast polegania
      # na domyślnym `xcode-select`.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available iOS -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Picked simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Rozbite na dwa kroki (nie jedno `xcodebuild test`) — standardowy,
      # bardziej niezawodny wzorzec CI (przydatny też np. do współdzielenia
      # jednego builda między kilkoma równoległymi runami testów). Pierwotnie
      # podejrzewany jako fix na wyścig w harmonogramowaniu, ale prawdziwą
      # przyczyną błędu "has no member" okazał się Xcode 16.4 (patrz krok
      # "Select Xcode 26.3" wyżej) — zostaje mimo to, bo to i tak lepszy
      # wzorzec niż jedno połączone `xcodebuild test`.
      # `set -o pipefail` KRYTYCZNE — bez tego `| tee` maskuje kod wyjścia
      # xcodebuild (pipe bez pipefail zwraca kod OSTATNIEGO polecenia, czyli
      # zawsze-udanego `tee`), więc krok "udawałby" sukces nawet gdy build
      # faktycznie padł, i powiadomienie Telegram niżej nigdy by się nie
      # odpaliło.
      - name: Build for Testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PMemoriesApp.xcodeproj \
            -scheme PMemoriesApp \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            2>&1 | tee build.log

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PMemoriesApp.xcodeproj \
            -scheme PMemoriesApp \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            2>&1 | tee test.log

      # 14.09.2026 — user: "chcę dostawać info na Telegram co było błędem i
      # czy naprawione", ŚWIADOMIE bez auto-fixa/auto-deploya (chce
      # zachować kontrolę nad tym co się realnie zmienia w appce) — samo
      # wykrywanie + powiadamianie, naprawę zleca ręcznie. `if: failure()`/
      # `if: success()` odpalają się WYŁĄCZNIE gdy poprzednie kroki JOBA
      # faktycznie failed/passed (standardowa semantyka GitHub Actions),
      # więc drugi krok nigdy nie wyśle "naprawione" po failu.
      # `printf` zamiast wieloliniowego `"..."` — string bash rozciągnięty na
      # kilka linii zaczynających się od kolumny 0 łamie wcięcia bloku YAML
      # (`run: |` wymaga, żeby KAŻDA linia treści była wcięta co najmniej
      # tak samo jak pierwsza — inaczej YAML uznaje blok za zakończony i
      # próbuje sparsować dalszy tekst jako nowe klucze, co dawało błąd
      # składni całego workflow, złapane na pierwszym realnym pushu).
      # `printf` z `%s` trzyma wszystko w jednej, poprawnie wciętej linii i
      # bezpiecznie wstawia treść commita (może zawierać cudzysłowy/znaki
      # specjalne) bez ryzyka złamania cudzysłowów.
      #
      # `github.head_ref || github.ref_name` — dla eventów `pull_request`
      # `ref_name` to wewnętrzna referencja scalania GitHuba ("2/merge"), nie
      # prawdziwa nazwa gałęzi — złapane na żywo (user dostał "Gałąź:
      # 2/merge" na Telegramie). `head_ref` istnieje tylko dla PR-ów i
      # zawiera prawdziwą nazwę gałęzi źródłowej; dla push/schedule jest
      # puste, więc `|| ref_name` wtedy poprawnie wraca do zwykłej gałęzi.
      - name: Notify Telegram on failure
        if: failure()
        run: |
          ERRORS=$(grep -h "error:" build.log test.log 2>/dev/null | head -5)
          if [ -z "$ERRORS" ]; then ERRORS="(zobacz pełny log pod linkiem niżej)"; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || 'Codzienne sprawdzenie (harmonogram)' }}"
          MESSAGE=$(printf '❌ PMemories CI FAILED\nGałąź: %s\nCommit: %s\n\nBłędy:\n%s\n\n%s' "${{ github.head_ref || github.ref_name }}" "$COMMIT_MSG" "$ERRORS" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null

      - name: Notify Telegram on success
        if: success()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || 'Codzienne sprawdzenie (harmonogram)' }}"
          MESSAGE=$(printf '✅ PMemories CI passed\nGałąź: %s\nCommit: %s' "${{ github.head_ref || github.ref_name }}" "$COMMIT_MSG")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
